<script>
  const products = [
    ['Apel', 10000, 10],
    ['Jeruk', 15000, 15],
    ['Anggur', 20000, 20],
  ];

  let printProducts = '';

  products.forEach((item, index) => {
    printProducts += `${index + 1}. ${item[0]} \n`;
  });

  const selectedProduct = prompt(
    `${printProducts} \n Select number of product:`
  );

  alert(`
    Product Name: ${products[selectedProduct - 1][0]} \n 
    Product Price: ${products[selectedProduct - 1][1]} \n
    Product Stock: ${products[selectedProduct - 1][1]}
  `);
</script>
